# WebSocket upgrade map — must live in the http context.
# Deploy to: /etc/nginx/conf.d/websocket_upgrade.conf
#
# Idempotent install command (run once on the VPS):
#   grep -q 'connection_upgrade' /etc/nginx/conf.d/websocket_upgrade.conf 2>/dev/null || \
#     cp /opt/boomboom/deploy/nginx/websocket_upgrade.conf /etc/nginx/conf.d/websocket_upgrade.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
