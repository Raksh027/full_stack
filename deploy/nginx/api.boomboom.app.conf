# BoomBoom API — Nginx HTTPS reverse proxy
# Deploy to: /etc/nginx/sites-available/api.boomboom.app
# Enable:    ln -sf /etc/nginx/sites-available/api.boomboom.app \
#                   /etc/nginx/sites-enabled/api.boomboom.app
#
# Certificate: Let's Encrypt via certbot TLS-ALPN-01 standalone
#   /etc/letsencrypt/live/api.boomboom.app/fullchain.pem
#   /etc/letsencrypt/live/api.boomboom.app/privkey.pem
#
# Depends on: /etc/nginx/conf.d/websocket_upgrade.conf  ($connection_upgrade map)
#
# DO NOT modify /etc/nginx/sites-available/api.weprettify.com.
# This file is a separate server block and is completely independent.
#
# AWS Global Accelerator note:
#   GA:443 → VPS:443  Layer 4 TCP passthrough — HTTPS works correctly.
#   GA:80  → VPS:443  Port override (wrong mapping in AWS console).
#   Until the GA port-80 override is corrected in the AWS console:
#     - Internet HTTP traffic hits this HTTPS server and gets a TLS error.
#     - The port-80 server block below is only reachable via direct VPS:80 access.
#     - certbot HTTP-01 renewal does NOT work. Use TLS-ALPN-01 (see renewal notes).
#   After the GA port-80 override is corrected:
#     - Switch renewal to: certbot renew --nginx  (HTTP-01, zero downtime)

# ─── HTTP server ─────────────────────────────────────────────────────────────
# Handles direct VPS:80 requests and ACME webroot renewal (after GA fix).
server {
    listen 80;
    server_name api.boomboom.app;

    # ACME webroot challenge location (used by certbot --nginx renewal after GA fix).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP to HTTPS.
    # Only effective for direct VPS:80 access; internet traffic goes via GA:80→VPS:443.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS server ─────────────────────────────────────────────────────────────
# Receives internet traffic via AWS Global Accelerator GA:443 → VPS:443 (TCP passthrough).
server {
    listen 443 ssl http2;
    server_name api.boomboom.app;

    # ── TLS certificate (managed by certbot) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.boomboom.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boomboom.app/privkey.pem;

    # Modern TLS settings (TLS 1.2 + 1.3 only; no RC4/3DES/SHA1).
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling — reduces handshake latency for clients.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                              always;
    add_header X-Frame-Options          "DENY"                                 always;
    add_header Referrer-Policy          "no-referrer"                          always;
    # HSTS — 1 year, include subdomains. Only set after confirming HTTPS works.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── FastAPI upstream ──────────────────────────────────────────────────────
    # Port 8080 is published only on 127.0.0.1 by Docker (not publicly accessible).
    # Configured in docker-compose.prod.yml: ports: ["127.0.0.1:8080:8080"]

    # General API and REST endpoints.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade support (required for /ws realtime endpoint).
        # $connection_upgrade is defined in /etc/nginx/conf.d/websocket_upgrade.conf
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;

        # Hide upstream server header (FastAPI/Uvicorn).
        proxy_hide_header Server;
    }

    # Dedicated WebSocket location — longer timeout for persistent connections.
    location /ws {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
