services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: boomboom
      POSTGRES_PASSWORD: boomboom_dev_only
      POSTGRES_DB: boomboom
    ports:
      - "5432:5432"
    volumes:
      - boomboom_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boomboom -d boomboom"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://boomboom:boomboom_dev_only@postgres:5432/boomboom
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: replace-with-a-long-random-local-dev-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000
      MEDIA_STORAGE_PATH: /app/storage/uploads
      SUBSCRIPTION_VERIFY_MODE: mock
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-BoomBoom}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.boomboom}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: /run/secrets/firebase-admin.json
    volumes:
      - boomboom_media:/app/storage/uploads
      - "${FIREBASE_CREDENTIALS_FILE:-./docker/firebase-credentials.placeholder}:/run/secrets/firebase-admin.json:ro"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        i=0
        until alembic upgrade head; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        uvicorn app.main:app --host 0.0.0.0 --port 8080

  worker:
    build: .
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://boomboom:boomboom_dev_only@postgres:5432/boomboom
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: replace-with-a-long-random-local-dev-secret
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: /run/secrets/firebase-admin.json
    volumes:
      - "${FIREBASE_CREDENTIALS_FILE:-./docker/firebase-credentials.placeholder}:/run/secrets/firebase-admin.json:ro"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.notifications"]

  # Admin UI is in a separate repo (../apps/admin).
  # To run it locally: docker compose -f docker-compose.yml -f docker-compose.override.admin.yml up
  # The service is excluded from the default compose to avoid build failures
  # when the admin app folder is not present.

volumes:
  boomboom_pgdata:
  boomboom_media:
