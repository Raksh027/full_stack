# Staging stack. Postgres and Redis are not published to the host.
# Put the API behind HTTPS (see deploy/Caddyfile.example).
# Secrets come from env_file / orchestrator — never from this file.

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: boomboom_staging
    volumes:
      - boomboom_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d boomboom_staging"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      SUBSCRIPTION_VERIFY_MODE: live
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/boomboom_staging
      REDIS_URL: redis://redis:6379/0
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: /run/secrets/firebase-admin.json
    expose:
      - "8080"
    volumes:
      - boomboom_staging_media:/app/storage/uploads
      - "${FIREBASE_CREDENTIALS_FILE:-./docker/firebase-credentials.placeholder}:/run/secrets/firebase-admin.json:ro"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        i=0
        until alembic upgrade head; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then exit 1; fi
          sleep 2
        done
        uvicorn app.main:app --host 0.0.0.0 --port 8080

  worker:
    build: .
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/boomboom_staging
      REDIS_URL: redis://redis:6379/0
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_JSON: /run/secrets/firebase-admin.json
    volumes:
      - "${FIREBASE_CREDENTIALS_FILE:-./docker/firebase-credentials.placeholder}:/run/secrets/firebase-admin.json:ro"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.notifications"]

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro
      - boomboom_caddy_data:/data
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  boomboom_staging_pgdata:
  boomboom_staging_media:
  boomboom_caddy_data:
